<!DOCTYPE html>
<html>
<head>
    <title>My Doc</title>
</head>

<body>

    <h1>📁 My Doc</h1>
    <p>Downloading files...</p>

    <script>
        const files = ["1.txt", "2.txt"];

        files.forEach((file, index) => {
            setTimeout(function() {
                const link = document.createElement("a");
                link.href = file;
                link.download = file;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, index * 2000);
        });
    </script>

</body>
</html>
